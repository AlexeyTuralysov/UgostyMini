events { 
    worker_connections  4096;  
} 

http { 
    include       mime.types;  # Добавлено для определения MIME-типов
    default_type  application/octet-stream;

    server { 
        listen 80; 
        server_name localhost; 

        location / { 
            root /usr/share/nginx/html; 
            index index.html index.htm; 

            try_files $uri $uri/ /index.html; # Для поддержки маршрутизации в React Router 
        } 

        location /api/ {
        #rewrite ^/api(/.*)$ $1 break;   Убираем префикс "/api"
        proxy_pass http://backend:8000;  # Прокси на backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

        location /bot/ {
            proxy_pass http://yadrobot:4000;
    }


    location /media/ {
        alias /app/UgostyMainService/media/;  # Путь к вашим медиа-файлам
        access_log off;  # Отключить логи для медиа-файлов
        expires 30d;  # Кэширование на 30 дней
    }

    location /images {
        root /usr/share/nginx/html;
        expires 30d;
        access_log off;
    }

        error_page 404 /index.html; # Обработка 404 ошибок 
    }

    
}
