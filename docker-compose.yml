services:
  nginx:
    image: nginx:latest
    container_name: nginx

    
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    - ./miniApp/dist:/usr/share/nginx/html

  
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    - ./nginx/html:/usr/share/nginx/html
    - ./data/certbot/conf:/etc/letsencrypt
    - ./data/certbot/www:/var/www/certbot

    ports:
      - "80:80"
      - "443:443"

    depends_on:
        
        - certbot

    networks:
      - webnet
   

  miniapp:
    build: 
      context: ./miniApp
    
    container_name: miniappcontainer
    volumes:
      - ./miniApp/dist:/app/dist

    ports:
      - "3000:80"


  certbot:
      image: certbot/certbot
      container_name: certbot
      volumes:
        - ./data/certbot/conf:/etc/letsencrypt
        - ./data/certbot/www:/var/www/certbot
      entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
      networks:
        - webnet
    



  backend-main:
    container_name: backend
    command: gunicorn UgostyMainService.wsgi:application --bind 0.0.0.0:8000

    build:
      context: ./UgostyMainService
      dockerfile: Dockerfile

    volumes:
      - ./UgostyMainService/:/usr/src/UgostyMainService/
      - ./UgostyMainService/media/:/app/UgostyMainService/media/

    ports:
      - "8000:8000"


  db:
    container_name: postgres_container
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: test_db

    volumes:
      - ./postgres-data:/var/lib/postgresql/data

    ports:
      - "5432:5432"




  pgadmin:

    container_name: pgadmin4_container
    image: 'docker.io/dpage/pgadmin4:latest'
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    
    ports:
      - "5050:80"


networks:
  webnet:
    driver: bridge